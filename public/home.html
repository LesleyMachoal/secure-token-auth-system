<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home - Token Auth</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="container">
    <div class="nav-links">
      <a id="navHome" class="active">🏠 Home</a>
      <a id="navDashboard" href="/dashboard.html">📊 Dashboard</a>
      <a id="navProfile" href="/profile.html">👤 Profile</a>
    </div>

    <h1>Welcome! 👋</h1>
    <div id="homeAlert"></div>

    <!-- User Welcome Info -->
    <div class="welcome-card">
      <img src="/images/user.png" alt="User Avatar" style="width: 80px; height: 80px; border-radius: 50%; margin-bottom: 15px; display: block; margin-left: auto; margin-right: auto;">
      <div class="welcome-greeting" id="homeGreeting">Loading...</div>
      <div class="user-info" id="homeUserInfo">
        <div class="user-info-item">
          <span class="user-label">Email</span>
          <span class="user-value" id="homeEmail">-</span>
        </div>
        <div class="user-info-item">
          <span class="user-label">User ID</span>
          <span class="user-value" id="homeUserId">-</span>
        </div>
      </div>
    </div>

    <!-- Token Status -->
    <div class="token-info" style="margin-top: 30px; padding: 20px; background: #f0f8ff; border-radius: 8px; border: 1px solid #0066cc;">
      <div style="font-size: 16px; font-weight: bold; margin-bottom: 15px;">✓ Token Verified Successfully!</div>
      <div style="font-size: 14px; color: #333;">
        <div style="margin: 8px 0;"><strong>Status:</strong> Your authentication token has been verified and is active.</div>
        <div style="margin: 8px 0;"><strong>Next Steps:</strong> You can now access the Dashboard to manage your tokens or view your Profile.</div>
      </div>
    </div>

    <!-- Quick Actions -->
    <div class="button-group">
      <button id="goToDashboardBtn" type="button">📊 Go to Dashboard</button>
      <button id="goToProfileBtn" type="button">👤 View Profile</button>
      <button id="homeLogoutBtn" type="button" class="button-secondary">🚪 Logout</button>
    </div>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
