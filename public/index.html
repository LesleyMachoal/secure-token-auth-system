<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secure Token Auth - Login</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="main">
    <div class="signin-content">
      <!-- Left side - Image -->
      <div class="signin-image">
        <figure>
          <img src="public/images/signin-image.jpg" alt="Authentication" onerror="this.style.display='none'">
        </figure>
        <a href="#" id="showRegisterId" class="signup-image-link">Create an account</a>
      </div>

      <!-- Right side - Forms -->
      <div class="form-container">
        <div id="loginContainer">
          <form class="signin-form" id="loginForm">
            <h2>Login</h2>
            <div id="loginAlert"></div>
            
            <div class="form-floating mb-3">
              <input type="email" class="form-control" id="loginEmail" required>
              <label for="loginEmail">Email address</label>
            </div>
            
            <div class="form-floating mb-3">
              <input type="password" class="form-control" id="loginPassword" required>
              <label for="loginPassword">Password</label>
            </div>
            
            <div class="form-group mb-3">
              <input type="checkbox" id="rememberMe" class="form-check-input">
              <label for="rememberMe" class="form-check-label">Remember me</label>
            </div>

            <button class="w-100 btn btn-primary btn-lg" type="submit">Login</button>
            
            <hr class="my-4">
            <small class="text-muted">By clicking Login, you agree to the terms of use.</small>
            
            <div class="signup-link mt-4">
              <p>Don't have an account? <a id="showRegister">Sign Up</a></p>
            </div>
          </form>
        </div>

        <div id="registerContainer" class="hidden">
          <form class="signin-form" id="registerForm">
            <h2>Register</h2>
            <div id="registerAlert"></div>
            
            <div class="form-floating mb-3">
              <input type="email" class="form-control" id="registerEmail" required>
              <label for="registerEmail">Email address</label>
            </div>
            
            <div class="form-floating mb-3">
              <input type="text" class="form-control" id="firstName">
              <label for="firstName">First Name</label>
            </div>
            
            <div class="form-floating mb-3">
              <input type="text" class="form-control" id="lastName">
              <label for="lastName">Last Name</label>
            </div>
            
            <div class="form-floating mb-3">
              <input type="password" class="form-control" id="registerPassword" required>
              <label for="registerPassword">Password</label>
            </div>

            <button class="w-100 btn btn-primary btn-lg" type="submit">Register</button>
            
            <hr class="my-4">
            <small class="text-muted">By clicking Register, you agree to the terms of use.</small>
            
            <div class="signup-link mt-4">
              <p>Already have an account? <a id="showLogin">Login</a></p>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
